name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: bash scripts/swift.sh test -c release
      - name: Universal distribution
        run: TASHAIR_UNIVERSAL=1 bash scripts/build-dmg.sh
      - name: Verify distribution
        run: python3 scripts/check-distribution.py --universal
      - uses: actions/upload-artifact@v4
        with:
          name: TashAir-macOS
          path: |
            temp/outputs/TashAir.dmg
            temp/outputs/TashAir-macOS.zip
            temp/outputs/SHA256SUMS
